server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ES-модули .mjs (в т.ч. воркер PDF.js): отдавать с корректным MIME,
    # иначе браузер не грузит их как module ("Failed to fetch dynamically
    # imported module").
    location ~ \.mjs$ {
        types { }
        default_type text/javascript;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
