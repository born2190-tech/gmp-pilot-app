services:
  postgres:
    image: postgres:16-alpine
    container_name: gmp-erp-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gmp_erp}
      POSTGRES_USER: ${POSTGRES_USER:-gmp_user}
      # Прод: задать POSTGRES_PASSWORD в .env (не использовать дефолт!).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gmp_pass}
    ports:
      - "5434:5432"
    volumes:
      - gmp_erp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gmp_user -d gmp_erp"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: gmp-erp-backend
    environment:
      GMP_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-gmp_user}:${POSTGRES_PASSWORD:-gmp_pass}@postgres:5432/${POSTGRES_DB:-gmp_erp}
      # Прод: задать сильный GMP_SECRET_KEY в .env (подпись токенов/сессий).
      GMP_SECRET_KEY: ${GMP_SECRET_KEY:-dev-change-me}
      GMP_QC_SCAN_ROOT: /data/qc-scans
      # Ключ machine-API маркировки (DataMatrix-генератор → ERP). Прод: задать
      # сильное значение в .env; пусто = эндпоинты /api/marking выключены.
      GMP_MARKING_API_KEY: ${GMP_MARKING_API_KEY:-dev-marking-key}
    ports:
      - "8002:8000"
    volumes:
      # GMP true-copy scans of signed Ф-14 notifications. On-prem deploy: bind
      # this to a backed-up disk on the factory server. Pilot uses a named volume.
      - gmp_erp_qc_scans:/data/qc-scans
      # Photo evidence for receipt defect acts (СОП-209 Ф-12). Same disk
      # treatment as QC scans — backed up and tamper-tracked by sha256.
      - gmp_erp_defect_photos:/data/receipt-defect-photos
      # Сертификаты качества производителя (CoA) при приёмке. Без этого тома
      # файлы жили во временной ФС контейнера и терялись при пересборке.
      - gmp_erp_receipt_certs:/data/receipt-certificates
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: gmp-erp-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

  # Ежедневный бэкап PostgreSQL (pg_dump -Fc) + ротация. На проде том
  # gmp_erp_backups привязать к бэкапируемому/внешнему диску (off-site).
  db-backup:
    image: postgres:16-alpine
    container_name: gmp-erp-db-backup
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-gmp_pass}
      POSTGRES_USER: ${POSTGRES_USER:-gmp_user}
      POSTGRES_DB: ${POSTGRES_DB:-gmp_erp}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - gmp_erp_backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "[db-backup] started; daily pg_dump, keep $${BACKUP_KEEP_DAYS}d"
        while true; do
          ts=$$(date +%Y%m%d_%H%M%S)
          out="/backups/gmp_erp_$${ts}.dump"
          if pg_dump -h postgres -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -Fc -f "$${out}"; then
            echo "[db-backup] ok $${out} ($$(du -h "$${out}" | cut -f1))"
          else
            echo "[db-backup] FAILED at $${ts}" >&2
            rm -f "$${out}"
          fi
          find /backups -name 'gmp_erp_*.dump' -mtime +$${BACKUP_KEEP_DAYS} -delete 2>/dev/null || true
          sleep 86400
        done
    restart: unless-stopped

volumes:
  gmp_erp_postgres_data:
  gmp_erp_qc_scans:
  gmp_erp_defect_photos:
  gmp_erp_receipt_certs:
  gmp_erp_backups:
